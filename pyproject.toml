[tool.ruff]
target-version = "py39"
line-length = 120
exclude = ["notebooks", "training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"apps/xmlversion.py" = ["E501"]
"apps/relaxng.py" = ["W291"]
"apps/dtdversion.py" = ["W291"]
"apps/xsd.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "db", "model", "data_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
